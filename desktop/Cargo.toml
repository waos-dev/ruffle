[package]
name = "ruffle_desktop"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

# WaOS port: what `waos run` and `waos package` call the program.
[package.metadata.waos]
id = "dev.waos.ruffle"
name = "Ruffle"

# WaOS port: the movies the system offers Ruffle for, the extensions Ruffle's own Windows package
# declares (`desktop/packages/windows`), each by the MIME type freedesktop.org's shared MIME
# database gives it.
[[package.metadata.waos.file_associations]]
extensions = ["swf"]
name = "Flash Movie"
mime_type = "application/x-shockwave-flash"

[[package.metadata.waos.file_associations]]
extensions = ["spl"]
name = "FutureSplash Movie"
mime_type = "application/futuresplash"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
egui = { workspace = true }
egui_extras = { workspace = true, default-features = false, features = ["image"] }
image = { workspace = true, features = ["png"] }
egui-winit = { workspace = true }
fontdb = "0.23"
ruffle_common = { path = "../core/common" }
ruffle_core = { path = "../core", features = ["audio", "clap", "mp3", "aac", "nellymoser", "default_compatibility_rules", "egui"] }
ruffle_render = { path = "../render", features = ["clap"] }
ruffle_render_wgpu = { path = "../render/wgpu", features = ["clap"] }
ruffle_video_software = { path = "../video/software", optional = true }
ruffle_video_external = { path = "../video/external", features = ["openh264"], optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
winit = "0.30.13"
webbrowser = "1.2.4"
url = { workspace = true }
dirs = "6.0"
rfd = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
os_info = { version = "3", default-features = false }
unic-langid = "0.9.6"
sys-locale = "0.3.2"
wgpu = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
fluent-templates = { workspace = true }
toml_edit = { workspace = true, features = ["parse"] }
gilrs = "0.11"

tracing-tracy = { version = "0.11.3", optional = true, features = ["demangle"] }
rand = { workspace = true, default-features = true }
thiserror.workspace = true
async-channel.workspace = true
unicode-bidi = "0.3.18"
memmap2.workspace = true
walkdir.workspace = true
async-task = "4.7.1"

# WaOS port: what a desktop's own system serves and WaOS serves its own way. A WaOS app is a
# WASI component: its TLS is WaOS's, it has no sound library of a system's, no runtime of
# tokio's to drive, and one GPU backend, WaOS's.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
cpal = { workspace = true }
egui-wgpu = { workspace = true, features = ["winit"] }
ruffle_frontend_utils = { path = "../frontend-utils", features = ["cpal", "fs", "navigator"] }
tracing-appender = "0.2.5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }

[target.'cfg(target_os = "wasi")'.dependencies]
# Without its default features, which bring wgpu's own backends.
egui-wgpu = { workspace = true, default-features = false, features = ["winit"] }
ruffle_frontend_utils = { path = "../frontend-utils", default-features = false, features = ["fs", "navigator"] }
# Its channels and locks alone: tasks run on WaOS's own executor.
tokio = { workspace = true, features = ["sync", "macros"] }
wasdk = "0.8.0"
wasdk-wgpu = "0.8.0"
# The player's video on WaOS: H.264 through WaOS's decoders, the rest in software.
ruffle_video = { path = "../video" }
ruffle_video_software = { path = "../video/software" }
slotmap = { workspace = true }

[target.'cfg(unix)'.dependencies]
fontconfig = { version = "0.11.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", features = ["settings", "game_mode"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }

[build-dependencies]
vergen = { version = "10.0.3", features = ["build", "cargo"] }
vergen-gitcl = { version = "10.0.3" }
winresource = "0.1"

[package.metadata.winresource]
# https://learn.microsoft.com/en-us/windows/win32/menurc/stringfileinfo-block
ProductName = "Ruffle"
FileDescription = "Adobe Flash Player emulator"
CompanyName = "Ruffle LLC"
LegalCopyright = "Copyright © 2018 Ruffle LLC and Ruffle contributors"
# InternalName should be the same as the module name
InternalName = "ruffle_desktop"
OriginalFilename = "ruffle.exe"

[features]
default = ["software_video", "external_video", "lzma", "fontconfig", "freetype"]
shell-completions = ["dep:clap_complete"]
jpegxr = ["ruffle_core/jpegxr"]

# core features
avm2_debug = ["ruffle_core/avm2_debug"]
lzma = ["ruffle_core/lzma"]
software_video = ["ruffle_video_software"]
external_video = ["ruffle_video_external"]
tracy = ["tracing-tracy", "ruffle_render_wgpu/profile-with-tracy"]
tracy_images = ["tracy", "ruffle_render_wgpu/tracy_images"]
tracy_avm = ["tracy", "ruffle_core/tracy_avm"]
fontconfig = ["dep:fontconfig"]
fontconfig-dlopen = ["fontconfig", "fontconfig/dlopen"]
freetype = ["ruffle_frontend_utils/freetype"]

# wgpu features
render_debug_labels = ["ruffle_render_wgpu/render_debug_labels"]

# sandboxing
sandbox = []
