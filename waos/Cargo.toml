[package]
name = "ruffle_waos"
description = "Ruffle as a WaOS program: plays a movie in a window of WaOS"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

# What `waos run` and `waos package` call the program.
[package.metadata.waos]
id = "dev.waos.ruffle"
name = "Ruffle"

# A WaOS program is a WASI component, so everything it is made of is asked for on WASI alone:
# on any other target the crate is an empty binary, and the workspace's checks pass over it.
[target.'cfg(target_os = "wasi")'.dependencies]
wasdk = { git = "https://github.com/waos-dev/waos", rev = "cfb64f5ac10584ebcf6b5880c33b6032c61101e5" }
wasdk-wgpu = { git = "https://github.com/waos-dev/waos", rev = "cfb64f5ac10584ebcf6b5880c33b6032c61101e5" }
wasdk-adapter-egui = { git = "https://github.com/waos-dev/waos", rev = "cfb64f5ac10584ebcf6b5880c33b6032c61101e5" }
ruffle_core = { path = "../core", features = ["audio", "mp3", "aac", "nellymoser", "default_font", "default_compatibility_rules", "lzma"] }
ruffle_render = { path = "../render" }
ruffle_render_wgpu = { path = "../render/wgpu" }
ruffle_video = { path = "../video" }
ruffle_video_software = { path = "../video/software" }
wgpu = { workspace = true }
egui = { workspace = true }
# Without its default features, which bring wgpu's own backends: a WaOS program has WaOS's.
egui-wgpu = { version = "0.36.1", default-features = false }
async-channel = { workspace = true }
slotmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
