# WaOS port: checks that Ruffle still builds as a WaOS program. Upstream's own workflows run on
# `master` alone, so this is the one that runs on the `waos` branch.
name: WaOS port

on:
  push:
    branches: [waos]
  pull_request:
    branches: [waos]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for wasm32-wasip3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `rust-toolchain.toml` names the toolchain and its target; rustup installs both.
      - name: Install the Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "waos"

      - name: Check formatting
        run: cargo fmt -p ruffle_waos -- --check

      - name: Check clippy
        run: cargo clippy -p ruffle_waos --target wasm32-wasip3 -- -D warnings

      - name: Build
        run: cargo build -p ruffle_waos --target wasm32-wasip3

      # Ruffle's own desktop program, as a WaOS app.
      - name: Check the desktop program for WaOS
        run: cargo check -p ruffle_desktop --target wasm32-wasip3 --no-default-features --features software_video,lzma

      # What the port takes of Ruffle's own front ends must go on building for WaOS.
      - name: Check the shared front-end crate for WaOS
        run: cargo check -p ruffle_frontend_utils --target wasm32-wasip3 --features fs,ui
